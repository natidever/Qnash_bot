name: Keep Textbee Render Service Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render service
        run: |
          curl --fail --silent --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            https://textbee-i2m8.onrender.com/ \
            -o /dev/null
